name: Compilar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generar carpetas de plataforma (android/ios) si faltan
        run: flutter create --platforms=android .

      - name: Instalar dependencias
        run: flutter pub get

      - name: Poner nombre de la app (MyRecestas)
        run: |
          sed -i 's/android:label="[^"]*"/android:label="MyRecestas"/' android/app/src/main/AndroidManifest.xml

      - name: Agregar permiso de Internet (necesario para imágenes por URL)
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
          sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Permitir tráfico HTTP además de HTTPS (algunas URL de imagen no usan https)
        run: |
          grep -q 'usesCleartextTraffic' android/app/src/main/AndroidManifest.xml || \
          sed -i 's/<application/<application\n        android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Generar ícono de la app
        run: dart run flutter_launcher_icons

      - name: Compilar APK release (sin firmar, respaldo/pruebas)
        run: flutter build apk --release

      - name: Subir APK sin firmar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: recetas-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: Decodificar la llave de firma
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Compilar APK de release firmado (con el keystore de POS Pro)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cd android
          ./gradlew :app:assembleRelease --rerun-tasks --stacktrace \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore \
            -Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD

      - name: Verificar que el APK firmado se haya generado (diagnóstico)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "--- Árbol de android/app/build (o aviso si no existe) ---"
          find android/app/build -maxdepth 4 2>&1 || echo "android/app/build no existe"
          echo "--- Cualquier .apk en todo el repo ---"
          find . -name "*.apk" -exec ls -lh {} \; 2>&1 || echo "No se encontró ningún .apk"

      - name: Subir APK de release firmado como artefacto descargable
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: recetas-app-apk-firmado
          path: android/app/build/outputs/apk/release/*.apk
